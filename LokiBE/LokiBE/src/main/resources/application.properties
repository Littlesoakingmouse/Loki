spring.application.name=LokiBE
# Khong co profile nao duoc chon thi dung "dev" (application-dev.properties, chi co tren may dev)
spring.profiles.default=dev


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Loki?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false



#JWT Config
# Bat buoc: bien moi truong JWT_SECRET (hoac application-dev.properties tren may dev). Khong ghi secret o day
jwt.secret=${JWT_SECRET}
# 30 ngay; app goi POST /api/auth/refresh moi lan mo de gia han
jwt.expiration_time=2592000000

spring.web.error.include-message=always
# Google OAuth Client ID (used to verify Google idToken)
google.client-id=${GOOGLE_CLIENT_ID:878739657664-li1t25i8kl0a12aikpaqv24effvnrij4.apps.googleusercontent.com}

# Firebase Admin SDK key, relative to the working directory (LokiBE/LokiBE); override with FIREBASE_CONFIG_PATH. Never commit it
firebase.config-path=${FIREBASE_CONFIG_PATH:file:secrets/loki-1483f-firebase-adminsdk-fbsvc-816c93361b.json}

#Debug
# logging.level.org.springframework.web=DEBUG